name: lottie_fixup
description: >-
  Fixes Lottie/Bodymovin exports that crash or freeze the lottie Flutter
  package: audio layers, empty precomps, and unexecuted expressions (loops,
  wiggle, random, cross-layer links).
version: 0.2.0
homepage: https://github.com/kiu-chan/lottie_fixup
repository: https://github.com/kiu-chan/lottie_fixup
issue_tracker: https://github.com/kiu-chan/lottie_fixup/issues
funding:
  - https://ko-fi.com/monlycute
topics:
  - lottie
  - animation
  - after-effects
  - cli

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
